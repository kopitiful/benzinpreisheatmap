name: Update fuel price data

on:
  schedule:
    - cron: "0 8 * * 4" # Thursday, after the EU Oil Bulletin's Wednesday update
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh EU Oil Bulletin data
        run: |
          rm -f data/raw/oil_bulletin_history.xlsx
          python scripts/fetch_country_prices.py

      - name: Refresh FR/ES/IT regional data
        run: python scripts/fetch_regional_prices.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/country_prices.json data/regional_prices.json data/finegrid_prices.json
          git diff --cached --quiet || git commit -m "Update fuel price data"
          git push
